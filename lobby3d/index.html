<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>3D Floor — Ani's Arcade</title>
  <link rel="icon" href="../assets/fox-head.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lobby3d.css">
</head>
<body>
  <a class="arcade-back" href="../index.html">◀ 2D Lobby</a>
  <div id="fps" aria-live="off">FPS --</div>
  <div id="hud">
    <div id="title-bar">ANI'S ARCADE · 3D FLOOR</div>
    <div id="prompt" class="idle">Walk the neon · tap a cabinet</div>
    <div id="hint">WASD / arrows move · drag look · click / Enter play</div>
  </div>
  <canvas id="c"></canvas>
  <div id="pads" aria-hidden="true">
    <div class="dpad">
      <button type="button" data-dir="forward" aria-label="Forward">▲</button>
      <div class="mid">
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
      </div>
      <button type="button" data-dir="back" aria-label="Back">▼</button>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="lobby3d.js"></script>
</body>
</html>
