<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Fox Tower Defense</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0f14;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  .arcade-back {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 40;
    background: #1a2433;
    border: 1px solid #f39c12;
    color: #f7c948;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
  }
  #game-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #0e141c;
    touch-action: none;
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
  }
  #ui {
    width: 100%;
    max-width: 400px;
    padding: 8px 12px 12px 12px;
    background: linear-gradient(transparent, rgba(11,15,20, 0.95) 20%);
    box-sizing: border-box;
    z-index: 10;
  }
  .bar {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
    justify-content: space-between;
  }
  .stat {
    background: #1a2433;
    padding: 6px 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    flex: 1;
    text-align: center;
  }
  .btn-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .btn {
    background: #2a3a52;
    border: 0;
    color: #fff;
    padding: 10px 6px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 12px;
    flex: 1;
    cursor: pointer;
    text-align: center;
    line-height: 1.25;
  }
  .btn:active { background: #3a4a62; }
  .btn.armed {
    background: #c47a12;
    box-shadow: 0 0 0 2px #f7c948;
  }
  .btn:disabled { background: #334; color: #788; cursor: not-allowed; }
  .btn-action {
    background: #27ae60;
    font-size: 13px;
    padding: 10px;
    margin-top: 4px;
    width: 100%;
    border: 0;
    color: #fff;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-action:active { background: #219653; }
  .btn-action:disabled { background: #334; color: #788; cursor: not-allowed; }
  h3 {
    margin: 4px 0 4px;
    font-size: 12px;
    color: #89a;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  #action-tip {
    font-size: 11px;
    color: #f39c12;
    text-align: center;
    min-height: 16px;
    margin-bottom: 2px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 12, 18, 0.78);
    z-index: 20;
  }
  #overlay.show { display: flex; }
  .overlay-card {
    background: #152033;
    border: 2px solid #f39c12;
    border-radius: 12px;
    padding: 18px 22px;
    text-align: center;
    width: 240px;
  }
  .overlay-card h2 { margin: 0 0 8px; font-size: 18px; color: #f7c948; }
  .overlay-card p { margin: 0 0 12px; color: #c9d4e3; font-size: 13px; }
</style>
</head>
<body>

<a class="arcade-back" href="../../index.html">◀ Arcade</a>

<div id="game-container">
  <canvas id="game" width="400" height="640"></canvas>
  <div id="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">Base Down</h2>
      <p id="overlayMsg">The horde got through.</p>
      <button class="btn-action" onclick="restartGame()">Play Again</button>
    </div>
  </div>
</div>

<div id="ui">
  <div class="bar">
    <div class="stat" id="money">💰 50</div>
    <div class="stat" id="wave">Wave 1</div>
    <div class="stat" id="base">❤️ 100</div>
  </div>
  <div id="action-tip">Buy a fox tower, place it, then start the wave.</div>

  <h3>Shop</h3>
  <div class="btn-row">
    <button class="btn" id="buyTowerBtn" onclick="buyTower()"></button>
    <button class="btn" id="upDmgBtn" onclick="buyUpgrade('dmg')"></button>
    <button class="btn" id="upRngBtn" onclick="buyUpgrade('rng')"></button>
    <button class="btn" id="upRateBtn" onclick="buyUpgrade('rate')"></button>
  </div>

  <button class="btn-action" id="waveBtn" onclick="startNextWave()">Start Wave 1</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = canvas.width, H = canvas.height;
const GRID = 40;
const COLS = 10, ROWS = 16;

const foxHeadImg = new Image();
foxHeadImg.src = '../../assets/fox-head.png';
let foxHeadReady = false;
foxHeadImg.onload = () => { foxHeadReady = true; };

let money = 50;
let baseHealth = 100;
let wave = 1;
let waveInProgress = false;
let enemiesSpawnedCount = 0;
let totalEnemiesInWave = 0;
let zombies = [];
let towers = [];
let particles = [];
let selectedTower = null;
let pendingTowers = 1;
let gameOver = false;

const upgrades = {
  dmg:  { name: 'Damage',    level: 0, base: 25 },
  rng:  { name: 'Range',     level: 0, base: 20 },
  rate: { name: 'Fire Rate', level: 0, base: 30 }
};

function costOf(u) { return Math.round(u.base * Math.pow(1.45, u.level)); }
function towerCost() {
  const owned = towers.length + pendingTowers;
  return 20 + Math.max(0, owned - 1) * 10;
}
function statMul(level) { return 1 + level * 0.22; }

const path = [
  {x:4,y:0},{x:4,y:3},{x:2,y:3},{x:2,y:6},{x:5,y:6},{x:5,y:9},
  {x:7,y:9},{x:7,y:12},{x:4,y:12},{x:4,y:15}
];
const pathSet = new Set(path.map(p => p.x + ',' + p.y));
function inPath(x, y) { return pathSet.has(x + ',' + y); }

function setTip(msg) {
  document.getElementById('action-tip').textContent = msg;
}

function startNextWave() {
  if (waveInProgress || gameOver) return;
  if (towers.length === 0) {
    setTip('Place at least one fox tower first!');
    return;
  }
  waveInProgress = true;
  enemiesSpawnedCount = 0;
  totalEnemiesInWave = (4 + wave * 2) + (wave % 5 === 0 ? 1 : 0);
  document.getElementById('waveBtn').disabled = true;
  document.getElementById('waveBtn').textContent = `Wave ${wave} In Progress...`;
  setTip('Defend the path!');
  spawnWave();
}

function spawnWave() {
  const count = 4 + wave * 2;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      if (waveInProgress && !gameOver) {
        spawnZombie(false);
        enemiesSpawnedCount++;
      }
    }, i * 600);
  }
  if (wave % 5 === 0) {
    setTimeout(() => {
      if (waveInProgress && !gameOver) {
        spawnZombie(true);
        enemiesSpawnedCount++;
      }
    }, count * 600 + 400);
  }
}

function spawnZombie(isGiant) {
  const baseSpeed = isGiant ? 0.45 : 0.85;
  const tierMultiplier = 1 + Math.floor(wave / 5) * 0.25;
  const rawHealth = isGiant ? (400 + wave * 50) : (70 + wave * 15);
  const scaledHealth = Math.round(rawHealth * tierMultiplier);
  const baseMoney = isGiant ? 55 : 14;
  const scaledMoney = Math.round(baseMoney * 1.25 * tierMultiplier);

  zombies.push({
    gx: path[0].x, gy: path[0].y,
    px: path[0].x * GRID + GRID / 2,
    py: path[0].y * GRID + GRID / 2,
    idx: 0,
    health: scaledHealth,
    maxHealth: scaledHealth,
    speed: baseSpeed * 0.85,
    money: scaledMoney,
    size: isGiant ? 24 : 15,
    giant: isGiant
  });
}

function handleInput(clientX, clientY) {
  if (gameOver) return;
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  const x = Math.floor((clientX - r.left) * scaleX / GRID);
  const y = Math.floor((clientY - r.top) * scaleY / GRID);
  if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;

  const existing = towers.find(t => t.gx === x && t.gy === y);
  if (existing) {
    selectedTower = existing;
    setTip('Tower selected — range shown.');
    refreshShop();
    return;
  }

  if (inPath(x, y)) {
    setTip('Cannot build on the path!');
    selectedTower = null;
    return;
  }

  if (pendingTowers <= 0) {
    selectedTower = null;
    setTip(`Buy a fox tower ($${towerCost()}) then tap a tile.`);
    return;
  }

  pendingTowers--;
  towers.push({ gx: x, gy: y, health: 100, maxHealth: 100, cd: 0 });
  selectedTower = towers[towers.length - 1];
  setTip(pendingTowers > 0
    ? `Tower placed! ${pendingTowers} left to place.`
    : 'Tower placed! Buy more from the shop.');
  refreshShop();
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.changedTouches.length > 0) {
    handleInput(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  handleInput(e.clientX, e.clientY);
});

function buyTower() {
  if (gameOver) return;
  const c = towerCost();
  if (money < c) {
    setTip(`Need $${c} for another fox tower.`);
    return;
  }
  money -= c;
  pendingTowers++;
  setTip(`Fox tower ready — tap an empty tile to place it. (${pendingTowers} waiting)`);
  refreshShop();
}

function buyUpgrade(key) {
  if (gameOver) return;
  const u = upgrades[key];
  const c = costOf(u);
  if (money < c) {
    setTip(`Can't afford ${u.name}. Need $${c}.`);
    return;
  }
  money -= c;
  u.level++;
  setTip(`${u.name} is now level ${u.level}.`);
  refreshShop();
}

function loseGame() {
  gameOver = true;
  waveInProgress = false;
  document.getElementById('overlayTitle').textContent = 'Base Down';
  document.getElementById('overlayMsg').textContent = `Survived to wave ${wave}.`;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('waveBtn').disabled = true;
}

function restartGame() {
  money = 50;
  baseHealth = 100;
  wave = 1;
  waveInProgress = false;
  enemiesSpawnedCount = 0;
  totalEnemiesInWave = 0;
  zombies = [];
  towers = [];
  particles = [];
  selectedTower = null;
  pendingTowers = 1;
  gameOver = false;
  upgrades.dmg.level = 0;
  upgrades.rng.level = 0;
  upgrades.rate.level = 0;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('waveBtn').disabled = false;
  document.getElementById('waveBtn').textContent = 'Start Wave 1';
  document.getElementById('wave').textContent = 'Wave 1';
  setTip('You have 1 free fox tower. Place it, then start the wave.');
  refreshShop();
}

function update() {
  if (gameOver || !waveInProgress) return;

  zombies.forEach(z => {
    const target = path[Math.min(z.idx + 1, path.length - 1)];
    const targetX = target.x * GRID + GRID / 2;
    const targetY = target.y * GRID + GRID / 2;
    const dx = targetX - z.px;
    const dy = targetY - z.py;
    const dist = Math.hypot(dx, dy);
    if (dist < 2) {
      z.idx++;
      z.px = targetX;
      z.py = targetY;
    } else {
      z.px += (dx / dist) * z.speed;
      z.py += (dy / dist) * z.speed;
    }
  });

  zombies = zombies.filter(z => {
    if (z.health <= 0) {
      money += z.money;
      for (let i = 0; i < 5; i++) {
        particles.push({
          x: z.px, y: z.py,
          vx: (Math.random() - 0.5) * 3,
          vy: (Math.random() - 0.5) * 3,
          life: 15, color: '#ffde7a'
        });
      }
      return false;
    }
    if (z.idx >= path.length) {
      baseHealth -= z.giant ? 15 : 5;
      if (baseHealth <= 0) {
        baseHealth = 0;
        loseGame();
      }
      return false;
    }
    return true;
  });

  if (waveInProgress && !gameOver && enemiesSpawnedCount >= totalEnemiesInWave && zombies.length === 0) {
    waveInProgress = false;
    wave++;
    document.getElementById('wave').textContent = `Wave ${wave}`;
    const waveBtn = document.getElementById('waveBtn');
    waveBtn.disabled = false;
    waveBtn.textContent = `Start Wave ${wave}`;
    setTip('Wave cleared! Buy upgrades or extra towers.');
  }

  const dmg = 28 * statMul(upgrades.dmg.level);
  const range = 130 * statMul(upgrades.rng.level);
  const fireRate = 0.95 * statMul(upgrades.rate.level);

  towers.forEach(t => {
    t.cd = Math.max(0, t.cd - 1 / 60);
    if (t.cd > 0) return;
    let target = null;
    let bestDist = Infinity;
    const tx = t.gx * GRID + GRID / 2;
    const ty = t.gy * GRID + GRID / 2;
    zombies.forEach(z => {
      const d = Math.hypot(z.px - tx, z.py - ty);
      if (d <= range && d < bestDist) {
        bestDist = d;
        target = z;
      }
    });
    if (target) {
      t.cd = 1 / fireRate;
      target.health -= dmg;
      particles.push({
        x: target.px, y: target.py,
        vx: 0, vy: -1.5, life: 12, color: '#ffde7a'
      });
    }
  });
}

function drawFoxTower(x, y, selected) {
  if (foxHeadReady) {
    const s = selected ? 38 : 34;
    ctx.drawImage(foxHeadImg, x - s / 2, y - s / 2 - 2, s, s);
    if (selected) {
      ctx.strokeStyle = 'rgba(247, 201, 72, 0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.stroke();
    }
    return;
  }
  ctx.fillStyle = selected ? '#f7c948' : '#e67e22';
  ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f39c12';
  ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = '#141d2b';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, H); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(W, i * GRID); ctx.stroke();
  }

  ctx.fillStyle = '#182436';
  path.forEach(p => ctx.fillRect(p.x * GRID + 2, p.y * GRID + 2, GRID - 4, GRID - 4));

  if (pendingTowers > 0) {
    ctx.fillStyle = 'rgba(247, 201, 72, 0.06)';
    for (let gx = 0; gx < COLS; gx++) {
      for (let gy = 0; gy < ROWS; gy++) {
        if (!inPath(gx, gy) && !towers.some(t => t.gx === gx && t.gy === gy)) {
          ctx.fillRect(gx * GRID + 2, gy * GRID + 2, GRID - 4, GRID - 4);
        }
      }
    }
  }

  if (selectedTower) {
    const tx = selectedTower.gx * GRID + GRID / 2;
    const ty = selectedTower.gy * GRID + GRID / 2;
    const range = 130 * statMul(upgrades.rng.level);
    ctx.strokeStyle = 'rgba(247, 201, 72, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(tx, ty, range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(247, 201, 72, 0.08)';
    ctx.fill();
  }

  towers.forEach(t => {
    const x = t.gx * GRID + GRID / 2;
    const y = t.gy * GRID + GRID / 2;
    drawFoxTower(x, y, selectedTower === t);
  });

  zombies.forEach(z => {
    ctx.fillStyle = z.giant ? '#e74c3c' : '#27ae60';
    ctx.beginPath(); ctx.arc(z.px, z.py, z.size, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillRect(z.px - 16, z.py - z.size - 8, 32, 4);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(z.px - 16, z.py - z.size - 8, 32 * Math.max(0, z.health / z.maxHealth), 4);
  });

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    ctx.fillStyle = p.color || '#ffde7a';
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

function loop() {
  update();
  draw();
  document.getElementById('money').textContent = `💰 ${Math.floor(money)}`;
  document.getElementById('base').textContent = `❤️ ${Math.max(0, Math.floor(baseHealth))}`;
  requestAnimationFrame(loop);
}

function refreshShop() {
  const tCost = towerCost();
  const tBtn = document.getElementById('buyTowerBtn');
  tBtn.textContent = pendingTowers > 0
    ? `Fox Tower\n${pendingTowers} ready`
    : `Fox Tower\n$${tCost}`;
  tBtn.classList.toggle('armed', pendingTowers > 0);

  const map = [
    ['upDmgBtn', upgrades.dmg],
    ['upRngBtn', upgrades.rng],
    ['upRateBtn', upgrades.rate]
  ];
  map.forEach(([id, u]) => {
    document.getElementById(id).textContent = `${u.name}\nL${u.level}  $${costOf(u)}`;
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') window.location.href = '../../index.html';
});

refreshShop();
loop();
</script>
</body>
</html>
