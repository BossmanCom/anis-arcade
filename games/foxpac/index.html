<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/games/foxpac/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>FOXPAC — Ani's Arcade</title>
  <link rel="icon" href="../../assets/fox-head.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="arcade-back" href="../../index.html">◀ Arcade</a>

  <div id="wrap">
    <header id="hud">
      <div class="hud-row">
        <span>SCORE <b id="score">0</b></span>
        <span id="title">FOXPAC</span>
        <span>LIVES <b id="lives">3</b></span>
      </div>
      <div class="hud-row sub">
        <span>LEVEL <b id="level">1</b></span>
        <span id="status">ARROWS / WASD · EAT THE MALWARE</span>
        <span>HI <b id="hiscore">0</b></span>
      </div>
    </header>

    <div id="canvas-wrap">
      <canvas id="game" width="304" height="336" aria-label="FOXPAC"></canvas>
      <div id="overlay" class="hidden">
        <p id="overlay-title">FOXPAC</p>
        <p id="overlay-msg">PRESS ENTER / TAP TO START</p>
      </div>
    </div>

    <div id="pads">
      <div class="dpad">
        <button type="button" data-dir="up" aria-label="Up">▲</button>
        <div class="mid">
          <button type="button" data-dir="left" aria-label="Left">◀</button>
          <button type="button" data-dir="right" aria-label="Right">▶</button>
        </div>
        <button type="button" data-dir="down" aria-label="Down">▼</button>
      </div>
      <button type="button" id="startBtn" aria-label="Start or restart">START<br><small>ENTER</small></button>
    </div>
  </div>

  <script src="game.js?v=respawn2"></script>
</body>
</html>
