<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>ANI CLAW — Ani's Arcade</title>
  <link rel="icon" href="../../assets/fox-head.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=enter2">
</head>
<body>
  <a class="arcade-back" href="../../index.html">◀ Arcade</a>
  <div id="fps" aria-live="off">FPS --</div>
  <div id="hud">
    <div class="hud-row">
      <span id="credits">CREDITS <b>5</b></span>
      <span id="wins">WINS <b>0</b></span>
    </div>
    <div id="status">MOVE CLAW · SPACE TO DROP</div>
  </div>
  <div id="canvas-wrap">
    <canvas id="game"></canvas>
    <div id="fx-flash" aria-hidden="true"></div>
    <div id="fx-chroma" aria-hidden="true"></div>
    <div id="confetti" aria-hidden="true"></div>
  </div>
  <div id="banner" class="hidden" aria-live="polite"></div>
  <div id="pads">
    <div class="dpad">
      <button type="button" data-dir="up" aria-label="Forward">▲</button>
      <div class="mid">
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
      </div>
      <button type="button" data-dir="down" aria-label="Back">▼</button>
    </div>
    <button type="button" id="dropBtn" aria-label="Drop claw">DROP<br><small>SPACE</small></button>
  </div>
  <div class="la-mark">L&amp;A</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js?v=enter2"></script>
</body>
</html>
